[city]
# City #2 of the address-import family (decided 2026-08-13). Hamilton has no
# neighbourhood polygon layer, so neighbourhoods_url stays empty and the tile
# builder quadtree-splits [osm] city_bbox directly (the "no layer" path).
slug = "hamilton"
name = "Hamilton"
neighbourhoods_url = ""

[source]
sqlite_path = "C:/Users/kk/Code/ontario-address-changes/data/hamilton/hamilton.db"

# Per-city projection recipe (multi-city Tier 2). Hamilton's tracker TOML maps
# the canonical street to the source's FULL_STREET_NAME ("Hall Road" — already
# typed, 100% populated), so `street` is usable directly; the survey's
# street_source="props" described the survey's own recipe, not a defect.
# Undeclared fields are absent capabilities: Hamilton has no address ranges,
# no address class, no ward — the features reading them are disabled-for-cause
# by the engine, visibly (03-capability-gating.md).
[source_fields]
street_from = "street"
# The layer publishes no combined address column (13 fields, confirmed
# 2026-08-10); synthesize "number street" the way the tracker's reports do.
full_from = "number+street"
# COMMUNITY is the former-municipality field ("Hamilton", "Dundas", "Stoney
# Creek", "Glanbrook", …) — the dedup-keying analogue of Toronto's
# MUNICIPALITY_NAME. The props MUNICIPALITY field is the constant "City of
# Hamilton" and would be useless as a key. NOTE: this feeds dedup keying and
# review display only — never addr:city, which is a separate open decision
# (TODO.md §2).
municipality = "props:COMMUNITY"

[run_defaults]
# Small downtown rectangle (around Gore Park) for first test runs.
bbox = [43.25, -79.88, 43.27, -79.85]
overpass_url = "https://overpass-api.de/api/interpreter"

[osm]
source = "local"
# Same Ontario PBF as every city in the portfolio.
pbf_url = "https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf"
# Source-data extent (273,441 rows measured 2026-08-13: lat 43.051..43.468,
# lon -80.244..-79.625) plus a small margin. A rectangle is not a boundary —
# amalgamated Hamilton borders Burlington and Brantford; see the engine's
# future-work/multi-city/10-boundary-clipping.md before trusting edge tiles.
city_bbox = [43.04, -80.26, 43.48, -79.61]
extract_dir = "data/osm"

[conflation]
match_radius_m = 100
match_near_m = 15

[checks]
match_far = true
# suffix_range deliberately absent: it reads lo_num/hi_num, which Hamilton's
# source does not have ([source_fields] declares none). The engine refuses to
# start a run whose config explicitly enables a check its source cannot
# support, and shows it as "n/a" rather than "off" in the run UI.
city_duplicate = true
missing_sample = true
nearby_street_mismatch = true

[check_params.city_duplicate]
radius_m = 3.0

[check_params.missing_sample]
every_nth = 50

[check_params.nearby_street_mismatch]
radius_m = 20.0

[check_params.match_number_drift]
slack_m = 2.0

[upload]
changesets_per_minute = 1
changeset_comment_template = "{city} Open Data address import, run={run_name}"

[export]
attribution = "City of Hamilton Open Data"
# No import wiki page exists yet — write and publish one per the OSM Import
# Guidelines and fill this in BEFORE any production upload.
import_plan = ""
